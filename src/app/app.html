<div class="container">

  <h1>Task Manager Angular</h1>
  <p>Meu primeiro projeto em Angular 🚀</p>

  <!-- Campo de entrada e botão -->
  <input 
    type="text" 
    placeholder="Digite uma tarefa..." 
    [(ngModel)]="novaTarefa"
    (keyup.enter)="adicionarTarefa()"
  >
  <button class="btn-adicionar" (click)="adicionarTarefa()">Adicionar</button>

  <h2>Minhas Tarefas</h2>

  <ul>
    <li *ngFor="let tarefa of listaTarefas; let i = index">
      <span class="texto-tarefa">{{ tarefa }}</span>
      <button class="btn-remover" (click)="removerTarefa(i)">Remover</button>
    </li>
  </ul>

</div>
